<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111c33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#1e2b47"/>
    </pattern>
    <style>
      .t{font-family:'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif}
      .m{font-family:'Consolas','SFMono-Regular','Menlo',monospace}
      .grow{transform-origin:70px 0;animation:g 1.6s ease-out forwards}
      @keyframes g{from{transform:scaleX(0)}to{transform:scaleX(1)}}
      .fade{opacity:0;animation:f .9s ease-out .3s forwards}
      @keyframes f{to{opacity:1}}
    </style>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect x="640" width="560" height="300" fill="url(#dots)"/>
  <rect width="1200" height="300" fill="url(#bg)" opacity="0.35"/>

  <!-- code window -->
  <g transform="translate(790 62)" class="fade">
    <rect width="340" height="176" rx="10" fill="#0e1729" stroke="#22314f"/>
    <circle cx="20" cy="18" r="5" fill="#f87171"/><circle cx="38" cy="18" r="5" fill="#fbbf24"/><circle cx="56" cy="18" r="5" fill="#34d399"/>
    <g class="m" font-size="14">
      <text x="20" y="58" fill="#818cf8">const</text><text x="70" y="58" fill="#e2e8f0">engineer = {</text>
      <text x="40" y="84" fill="#94a3b8">role:</text><text x="88" y="84" fill="#7dd3fc">"Frontend Engineer",</text>
      <text x="40" y="108" fill="#94a3b8">stack:</text><text x="96" y="108" fill="#7dd3fc">["React", "Next.js", "TS"],</text>
      <text x="40" y="132" fill="#94a3b8">workflow:</text><text x="122" y="132" fill="#7dd3fc">"AI-assisted",</text>
      <text x="20" y="158" fill="#e2e8f0">};</text>
    </g>
  </g>

  <!-- text -->
  <text class="m" x="70" y="96" font-size="15" fill="#38bdf8" letter-spacing="2">HELLO, I'M</text>
  <text class="t" x="66" y="156" font-size="62" font-weight="800" fill="#f8fafc">Ahmed Saber</text>
  <rect class="grow" x="70" y="172" width="120" height="4" rx="2" fill="url(#accent)"/>
  <text class="t" x="70" y="214" font-size="24" font-weight="600" fill="#cbd5e1">Frontend Engineer · React · Next.js · TypeScript</text>
  <text class="t" x="70" y="248" font-size="17" fill="#8193b2">Building fast, accessible and bilingual web applications · Cairo, Egypt</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
