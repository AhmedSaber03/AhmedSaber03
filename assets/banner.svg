<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05010f"/>
      <stop offset="55%" stop-color="#0a0b2e"/>
      <stop offset="100%" stop-color="#001a2c"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff">
        <animate attributeName="stop-color" values="#00f0ff;#b14cff;#ff2bd6;#00f0ff" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#b14cff">
        <animate attributeName="stop-color" values="#b14cff;#ff2bd6;#00f0ff;#b14cff" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ff2bd6">
        <animate attributeName="stop-color" values="#ff2bd6;#00f0ff;#b14cff;#ff2bd6" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1d3b6b" stroke-width="0.6" opacity="0.55"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .t{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
      .mono{font-family:'Consolas','SFMono-Regular','Menlo',monospace}
      .blink{animation:b 1.1s steps(1) infinite}
      @keyframes b{50%{opacity:0}}
      .float{animation:f 6s ease-in-out infinite}
      @keyframes f{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
      .pulse{animation:p 2.4s ease-in-out infinite}
      @keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- horizon glow -->
  <ellipse cx="600" cy="330" rx="620" ry="70" fill="#7b2cff" opacity="0.18"/>

  <!-- scanning line -->
  <rect x="0" y="-60" width="1200" height="60" fill="url(#scan)">
    <animate attributeName="y" values="-60;320" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- corner HUD brackets -->
  <g stroke="url(#neon)" stroke-width="2" fill="none" opacity="0.9">
    <path d="M24 64V24H64"/><path d="M1136 24H1176V64"/>
    <path d="M24 256V296H64"/><path d="M1176 256V296H1136"/>
  </g>

  <!-- orbit rings -->
  <g transform="translate(1010 160)" opacity="0.85">
    <circle r="78" fill="none" stroke="#00f0ff" stroke-opacity="0.25" stroke-width="1"/>
    <circle r="56" fill="none" stroke="#b14cff" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="4 6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle r="34" fill="none" stroke="#ff2bd6" stroke-opacity="0.45" stroke-width="1.2" stroke-dasharray="10 8">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="10s" repeatCount="indefinite"/>
    </circle>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
      <circle cx="78" cy="0" r="4" fill="#00f0ff" filter="url(#glow)"/>
    </g>
    <text class="mono" text-anchor="middle" y="6" font-size="18" fill="#e6f7ff" filter="url(#glow)">&lt;/&gt;</text>
  </g>

  <!-- text block -->
  <g class="float">
    <text class="mono pulse" x="70" y="92" font-size="15" fill="#00f0ff" letter-spacing="3">// SYSTEM.ONLINE — CAIRO, EGYPT</text>
    <text class="t" x="66" y="162" font-size="68" font-weight="800" fill="url(#neon)" filter="url(#glow)" letter-spacing="2">AHMED SABER</text>
    <text class="t" x="70" y="204" font-size="24" font-weight="600" fill="#e6f0ff">Frontend Engineer
      <tspan fill="#7c8db5"> · </tspan>React<tspan fill="#7c8db5"> · </tspan>Next.js<tspan fill="#7c8db5"> · </tspan>TypeScript</text>
    <text class="mono" x="70" y="246" font-size="16" fill="#9fb3d9">&gt; building fast, accessible, bilingual web apps with an AI-first workflow<tspan class="blink" fill="#00f0ff">▌</tspan></text>
  </g>

  <!-- bottom status bar -->
  <g class="mono" font-size="12" fill="#5f7aa8">
    <text x="70" y="290">STATUS: SHIPPING</text>
    <text x="300" y="290">STACK: REACT/NEXT/TS</text>
    <text x="520" y="290">MODE: AI-ASSISTED</text>
    <text x="720" y="290">YEAR: 2060.READY</text>
  </g>
  <rect x="70" y="298" width="760" height="2" fill="url(#neon)" opacity="0.7"/>
</svg>
